name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate prep assets
        run: npm run prep:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        run: npm run build
